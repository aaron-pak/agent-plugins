name: Validate plugins

# pak-plugins holds only what installs need; pak-tools runs every other check before it exports here.
# This checks the marketplace and each plugin the way Claude Code loads them.

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code@2.1.318

      # --strict fails on warnings. The one warning allowed is a missing version: a mod's
      # .claude-plugin/plugin.json leaves it unset on purpose, like every manifest here.
      - name: Validate the marketplace and each plugin with Claude Code
        run: |
          status=0
          for target in . plugins/*/; do
            # Claude Code reads a plugin folder on its own only through skills/ or a
            # .claude-plugin/plugin.json; a Codex-only plugin has neither, and the marketplace
            # check covers its entry.
            case "$target" in plugins/*/)
              [ -d "$target/skills" ] || [ -f "$target/.claude-plugin/plugin.json" ] || continue ;;
            esac
            out=$(claude plugin validate --strict "$target" 2>&1) && { echo "$out"; continue; }
            echo "$out"
            warnings=$(echo "$out" | sed -n 's/.*Found \([0-9]*\) warning.*/\1/p')
            unset_versions=$(echo "$out" | grep -c 'No version specified' || true)
            if echo "$out" | grep -q 'Found [0-9]* error' || [ "${warnings:-0}" != "$unset_versions" ]; then
              status=1
            fi
          done
          exit $status
